<div class="main-content" id="newsFeedListTable">
    <div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
        <div class="breadcrumb-title pe-3">Dashboard</div>
        <div class="ps-3">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0 p-0">
                    <li class="breadcrumb-item"><a href="javascript:;"><i class="bx bx-home-alt"></i></a></li>
                    <li class="breadcrumb-item active" aria-current="page">News Feed</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-auto ms-auto">
            <button class="btn btn-primary px-4" data-bs-toggle="modal" data-bs-target="#NewsFeedModal">
                <i class="bi bi-plus-lg me-2"></i>Add News Item
            </button>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive white-space-nowrap">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>News Text</th>
                            <th>URL</th>
                            <th>Sort Order</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in items %}
                        <tr>
                            <td class="fw-semibold">{{ item.news }}</td>
                            <td>{{ item.url|default:"—" }}</td>
                            <td>{{ item.sort_order }}</td>
                            <td>
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input toggle-news-feed-active" type="checkbox"
                                        role="switch" data-id="{{ item.id }}"
                                        {% if item.is_active %}checked{% endif %}>
                                </div>
                            </td>
                            <td>
                                <div class="d-flex gap-1">
                                    <button class="btn btn-sm btn-filter edit-news-feed-btn"
                                        data-id="{{ item.id }}"
                                        data-news="{{ item.news }}"
                                        data-url="{{ item.url|default:'' }}"
                                        data-sort-order="{{ item.sort_order }}"
                                        data-is-active="{{ item.is_active|yesno:'true,false' }}"
                                        data-bs-toggle="modal" data-bs-target="#NewsFeedModal">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger delete-news-feed-btn"
                                        data-id="{{ item.id }}" data-news="{{ item.news }}"
                                        data-bs-toggle="modal" data-bs-target="#deleteNewsFeedModal">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="5" class="text-center py-4">No news feed items found.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit News Feed Modal -->
<form method="post" id="add_news_feed_form" hx-ignore="true" autocomplete="off">
    <input type="hidden" name="item_id" id="news_feed_id">

    <div class="modal fade" id="NewsFeedModal">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header border-bottom-0 bg-grd-primary py-2">
                    <h5 class="modal-title" id="news_feed_modal_title">Add News Item</h5>
                    <a href="javascript:;" class="primaery-menu-close" data-bs-dismiss="modal" id="close_add_news_feed_modal">
                        <i class="material-icons-outlined">close</i>
                    </a>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">News Text <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="news" placeholder="Free delivery on orders over 2000৳" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL</label>
                        <input type="text" class="form-control" name="url" placeholder="Optional link">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Sort Order</label>
                        <input type="number" class="form-control" name="sort_order" value="0">
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="is_active" id="news_feed_is_active" checked>
                        <label class="form-check-label" for="news_feed_is_active">Active</label>
                    </div>
                </div>
                <div class="modal-footer border-top-0">
                    <button type="button" class="btn btn-grd-danger" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-grd-info">Save changes</button>
                </div>
            </div>
        </div>
    </div>
</form>

<!-- Delete News Feed Modal -->
<div class="modal fade" id="deleteNewsFeedModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-bottom-0 py-2">
                <h5 class="modal-title">Delete News Item</h5>
                <a href="javascript:;" class="primaery-menu-close" data-bs-dismiss="modal" id="close_delete_news_feed_modal">
                    <i class="material-icons-outlined">close</i>
                </a>
            </div>
            <div class="modal-body delete-news-feed-modal-body">Are you sure you want to delete this news item?</div>
            <div class="modal-footer border-top-0">
                <button type="button" class="btn btn-grd-danger" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-grd-info" id="confirmDeleteNewsFeedBtn">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("submit", async function (e) {
    if (e.target.id !== "add_news_feed_form") return;
    e.preventDefault();

    const csrftoken = getCookieNewsFeed("csrftoken");
    if (!csrftoken) {
        alert("Session expired. Please refresh the page and try again.");
        return;
    }

    const form = e.target;
    if (!form.querySelector("input[name='news']").value.trim()) {
        alert("News text is required");
        return;
    }

    try {
        const formData = new FormData(form);
        formData.set("csrfmiddlewaretoken", csrftoken);

        const response = await fetch("{% url 'news_feed' %}", {
            method: "POST",
            body: formData,
            headers: { "X-CSRFToken": csrftoken, "X-Requested-With": "XMLHttpRequest" },
        });

        const data = await response.json();

        if (data.status) {
            document.getElementById("close_add_news_feed_modal").click();
            form.reset();
            document.getElementById("news_feed_id").value = "";
            document.getElementById("news_feed_modal_title").textContent = "Add News Item";
            alert(data.message);
            setTimeout(function () { window.location.reload(); }, 600);
        } else {
            alert(data.message);
        }
    } catch (error) {
        alert(error.message);
    }
});

document.addEventListener("click", function (e) {
    const btn = e.target.closest(".edit-news-feed-btn");
    if (btn) {
        document.getElementById("news_feed_modal_title").textContent = "Update News Item";
        document.getElementById("news_feed_id").value = btn.dataset.id;

        const form = document.getElementById("add_news_feed_form");
        form.querySelector("input[name='news']").value = btn.dataset.news;
        form.querySelector("input[name='url']").value = btn.dataset.url;
        form.querySelector("input[name='sort_order']").value = btn.dataset.sortOrder;
        form.querySelector("#news_feed_is_active").checked = btn.dataset.isActive === "true";
    }
});

document.getElementById("NewsFeedModal")?.addEventListener("hidden.bs.modal", function () {
    const form = document.getElementById("add_news_feed_form");
    form.reset();
    document.getElementById("news_feed_id").value = "";
    document.getElementById("news_feed_modal_title").textContent = "Add News Item";
});

let deleteNewsFeedId = null;
document.addEventListener("click", function (e) {
    const btn = e.target.closest(".delete-news-feed-btn");
    if (btn) {
        deleteNewsFeedId = btn.dataset.id;
        document.querySelector(".delete-news-feed-modal-body").textContent =
            'Are you sure you want to delete "' + btn.dataset.news + '"?';
    }
});

document.addEventListener("click", function (e) {
    if (!e.target.closest("#confirmDeleteNewsFeedBtn")) return;
    if (!deleteNewsFeedId) { alert("News item ID is not found"); return; }
    const csrftoken = getCookieNewsFeed("csrftoken");
    fetch(`/settings/news-feed/delete/${deleteNewsFeedId}/`, {
        method: "DELETE",
        headers: { "X-CSRFToken": csrftoken, "X-Requested-With": "XMLHttpRequest" },
    })
    .then(response => response.json())
    .then(data => {
        if (data.status) {
            document.getElementById("close_delete_news_feed_modal").click();
            alert(data.message);
            setTimeout(function () { window.location.reload(); }, 600);
        } else {
            alert(data.message);
        }
    })
    .catch(error => alert(error.message));
});

document.addEventListener("change", function (e) {
    const toggle = e.target.closest(".toggle-news-feed-active");
    if (!toggle) return;
    const id = toggle.dataset.id;
    const wantActive = toggle.checked;
    const csrftoken = getCookieNewsFeed("csrftoken");

    fetch(`/settings/news-feed/toggle/${id}/`, {
        method: "POST",
        headers: { "X-CSRFToken": csrftoken, "X-Requested-With": "XMLHttpRequest", "Content-Type": "application/x-www-form-urlencoded" },
        body: `is_active=${wantActive}`,
    })
    .then(response => response.json())
    .then(data => {
        if (!data.status) {
            toggle.checked = !wantActive;
            alert(data.message);
        }
    })
    .catch(error => {
        toggle.checked = !wantActive;
        alert(error.message);
    });
});

function getCookieNewsFeed(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
