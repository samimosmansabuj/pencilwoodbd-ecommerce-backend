<div class="main-content" id="footerLinkListTable">
    <div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
        <div class="breadcrumb-title pe-3">Dashboard</div>
        <div class="ps-3">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0 p-0">
                    <li class="breadcrumb-item"><a href="javascript:;"><i class="bx bx-home-alt"></i></a></li>
                    <li class="breadcrumb-item active" aria-current="page">Footer Links</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-auto ms-auto">
            <button class="btn btn-primary px-4" data-bs-toggle="modal" data-bs-target="#FooterLinkModal">
                <i class="bi bi-plus-lg me-2"></i>Add Footer Link
            </button>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive white-space-nowrap">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>URL</th>
                            <th>Sort Order</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for link in links %}
                        <tr>
                            <td class="fw-semibold">{{ link.name }}</td>
                            <td>{{ link.url|default:"—" }}</td>
                            <td>{{ link.sort_order }}</td>
                            <td>
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input toggle-footer-link-active" type="checkbox"
                                        role="switch" data-id="{{ link.id }}"
                                        {% if link.is_active %}checked{% endif %}>
                                </div>
                            </td>
                            <td>
                                <div class="d-flex gap-1">
                                    <button class="btn btn-sm btn-filter edit-footer-link-btn"
                                        data-id="{{ link.id }}"
                                        data-name="{{ link.name }}"
                                        data-url="{{ link.url|default:'' }}"
                                        data-sort-order="{{ link.sort_order }}"
                                        data-is-active="{{ link.is_active|yesno:'true,false' }}"
                                        data-bs-toggle="modal" data-bs-target="#FooterLinkModal">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger delete-footer-link-btn"
                                        data-id="{{ link.id }}" data-name="{{ link.name }}"
                                        data-bs-toggle="modal" data-bs-target="#deleteFooterLinkModal">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="5" class="text-center py-4">No footer links found.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Footer Link Modal -->
<form method="post" id="add_footer_link_form" hx-ignore="true" autocomplete="off">
    <input type="hidden" name="link_id" id="footer_link_id">

    <div class="modal fade" id="FooterLinkModal">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header border-bottom-0 bg-grd-primary py-2">
                    <h5 class="modal-title" id="footer_link_modal_title">Add Footer Link</h5>
                    <a href="javascript:;" class="primaery-menu-close" data-bs-dismiss="modal" id="close_add_footer_link_modal">
                        <i class="material-icons-outlined">close</i>
                    </a>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL</label>
                        <input type="text" class="form-control" name="url" placeholder="/about.html or https://...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Sort Order</label>
                        <input type="number" class="form-control" name="sort_order" value="0">
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="is_active" id="footer_link_is_active" checked>
                        <label class="form-check-label" for="footer_link_is_active">Active</label>
                    </div>
                </div>
                <div class="modal-footer border-top-0">
                    <button type="button" class="btn btn-grd-danger" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-grd-info">Save changes</button>
                </div>
            </div>
        </div>
    </div>
</form>

<!-- Delete Footer Link Modal -->
<div class="modal fade" id="deleteFooterLinkModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-bottom-0 py-2">
                <h5 class="modal-title">Delete Footer Link</h5>
                <a href="javascript:;" class="primaery-menu-close" data-bs-dismiss="modal" id="close_delete_footer_link_modal">
                    <i class="material-icons-outlined">close</i>
                </a>
            </div>
            <div class="modal-body delete-footer-link-modal-body">Are you sure you want to delete this footer link?</div>
            <div class="modal-footer border-top-0">
                <button type="button" class="btn btn-grd-danger" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-grd-info" id="confirmDeleteFooterLinkBtn">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("submit", async function (e) {
    if (e.target.id !== "add_footer_link_form") return;
    e.preventDefault();

    const csrftoken = getCookieFooterLink("csrftoken");
    if (!csrftoken) {
        alert("Session expired. Please refresh the page and try again.");
        return;
    }

    const form = e.target;
    if (!form.querySelector("input[name='name']").value.trim()) {
        alert("Name is required");
        return;
    }

    try {
        const formData = new FormData(form);
        formData.set("csrfmiddlewaretoken", csrftoken);

        const response = await fetch("{% url 'footer_links' %}", {
            method: "POST",
            body: formData,
            headers: { "X-CSRFToken": csrftoken, "X-Requested-With": "XMLHttpRequest" },
        });

        const data = await response.json();

        if (data.status) {
            document.getElementById("close_add_footer_link_modal").click();
            form.reset();
            document.getElementById("footer_link_id").value = "";
            document.getElementById("footer_link_modal_title").textContent = "Add Footer Link";
            alert(data.message);
            setTimeout(function () { window.location.reload(); }, 600);
        } else {
            alert(data.message);
        }
    } catch (error) {
        alert(error.message);
    }
});

document.addEventListener("click", function (e) {
    const btn = e.target.closest(".edit-footer-link-btn");
    if (btn) {
        document.getElementById("footer_link_modal_title").textContent = "Update Footer Link";
        document.getElementById("footer_link_id").value = btn.dataset.id;

        const form = document.getElementById("add_footer_link_form");
        form.querySelector("input[name='name']").value = btn.dataset.name;
        form.querySelector("input[name='url']").value = btn.dataset.url;
        form.querySelector("input[name='sort_order']").value = btn.dataset.sortOrder;
        form.querySelector("#footer_link_is_active").checked = btn.dataset.isActive === "true";
    }
});

document.getElementById("FooterLinkModal")?.addEventListener("hidden.bs.modal", function () {
    const form = document.getElementById("add_footer_link_form");
    form.reset();
    document.getElementById("footer_link_id").value = "";
    document.getElementById("footer_link_modal_title").textContent = "Add Footer Link";
});

let deleteFooterLinkId = null;
document.addEventListener("click", function (e) {
    const btn = e.target.closest(".delete-footer-link-btn");
    if (btn) {
        deleteFooterLinkId = btn.dataset.id;
        document.querySelector(".delete-footer-link-modal-body").textContent =
            'Are you sure you want to delete "' + btn.dataset.name + '"?';
    }
});

document.addEventListener("click", function (e) {
    if (!e.target.closest("#confirmDeleteFooterLinkBtn")) return;
    if (!deleteFooterLinkId) { alert("Footer link ID is not found"); return; }
    const csrftoken = getCookieFooterLink("csrftoken");
    fetch(`/settings/footer-links/delete/${deleteFooterLinkId}/`, {
        method: "DELETE",
        headers: { "X-CSRFToken": csrftoken, "X-Requested-With": "XMLHttpRequest" },
    })
    .then(response => response.json())
    .then(data => {
        if (data.status) {
            document.getElementById("close_delete_footer_link_modal").click();
            alert(data.message);
            setTimeout(function () { window.location.reload(); }, 600);
        } else {
            alert(data.message);
        }
    })
    .catch(error => alert(error.message));
});

document.addEventListener("change", function (e) {
    const toggle = e.target.closest(".toggle-footer-link-active");
    if (!toggle) return;
    const id = toggle.dataset.id;
    const wantActive = toggle.checked;
    const csrftoken = getCookieFooterLink("csrftoken");

    fetch(`/settings/footer-links/toggle/${id}/`, {
        method: "POST",
        headers: { "X-CSRFToken": csrftoken, "X-Requested-With": "XMLHttpRequest", "Content-Type": "application/x-www-form-urlencoded" },
        body: `is_active=${wantActive}`,
    })
    .then(response => response.json())
    .then(data => {
        if (!data.status) {
            toggle.checked = !wantActive;
            alert(data.message);
        }
    })
    .catch(error => {
        toggle.checked = !wantActive;
        alert(error.message);
    });
});

function getCookieFooterLink(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
