{% comment %} Popup create/edit modal (multipart FormData, like the slider form) + live preview. No dimmed text. {% endcomment %}
<style>
  /* wide dialog (was shrinking to ~570px, leaving one side empty); preview card stays visible while the form scrolls */
  #popupModal .pux-dialog { max-width: min(1180px, 96vw); width: 96vw; margin-left: auto; margin-right: auto; }
  #popupModal .pux-layout > [class*="col-"] { min-width: 0; }
  #popupModal .pux-sticky { position: sticky; top: 0; }
  #popupModal .pux-frame.desktop { width: 100%; max-width: 440px; }
  #popupModal .pux-frame.mobile { width: 100%; max-width: 240px; }
  #popupModal .pux-help { overflow-wrap: anywhere; }
  @media (max-width: 991px) { #popupModal .pux-dialog { width: 100%; max-width: 100%; } #popupModal .pux-sticky { position: static; } }
  .pux-prev { border: 1px solid var(--bs-border-color, rgba(255,255,255,.2)); border-radius: 12px; padding: 12px; text-align: center; background: rgba(255,255,255,.045); }
  .pux-frame { position: relative; margin: 0 auto; border-radius: 10px; overflow: hidden; background: rgba(0,0,0,.35); display: inline-block; max-width: 100%; }
  .pux-frame.desktop { width: 420px; } .pux-frame.mobile { width: 230px; }
  .pux-frame img { width: 100%; display: block; }
  .pux-frame .pux-x { position: absolute; top: 6px; right: 8px; background: rgba(0,0,0,.6); color: #fff; border-radius: 50%; width: 24px; height: 24px; line-height: 22px; font-size: 14px; }
  .pux-frame .pux-btn { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: #dc2626; color: #fff; padding: 5px 16px; border-radius: 999px; font-weight: 700; font-size: .85rem; max-width: 90%; }
  .pux-search { position: relative; }

  .pux-results div { padding: 12px; min-height: 48px; cursor: pointer; border-bottom: 1px solid var(--bs-border-color, rgba(255,255,255,.1)); }

  .pux-help { font-size: .85rem; line-height: 1.45; margin-top: 4px; }
  .pux-help i { margin-right: 4px; }
  .pux-err { color: #f87171; font-size: .9rem; font-weight: 600; margin-top: 4px; }
  .pux-err:empty { display: none; }
  #popupModal .form-control, #popupModal .form-select { min-height: 44px; }
  #popupModal .btn { min-height: 44px; }
  #popupModal .form-label { font-weight: 600; }
  #popupModal .form-check-input[role="switch"] { width: 2.4em; height: 1.3em; }
  .pux-chosen { font-weight: 600; }
  @media (max-width: 991px) { .pux-frame.desktop { width: 100%; max-width: 420px; } }
  @media (max-width: 575px) { #popupModal .modal-footer .btn { flex: 1 1 140px; } #popupModal .modal-body { padding: 12px; } }
</style>
