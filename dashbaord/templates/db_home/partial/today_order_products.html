<div class="d-flex gap-3 mb-3 flex-wrap">
    <div class="card p-3 flex-fill"><h6 class="mb-1">Today Orders</h6><h3 class="mb-0">{{ order_count }}</h3></div>
    <div class="card p-3 flex-fill"><h6 class="mb-1">Total Pieces</h6><h3 class="mb-0 text-primary">{{ total_qty }}</h3></div>
    <div class="card p-3 flex-fill"><h6 class="mb-1">Date</h6><h5 class="mb-0">{{ today }}</h5></div>
</div>
<table class="table align-middle">
    <thead class="table-light"><tr><th>#</th><th>Product</th><th>Variant</th><th class="text-end">Pieces</th></tr></thead>
    <tbody>
    {% for r in rows %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ r.product }}</td>
            <td>{{ r.variant|default:"-" }}</td>
            <td class="text-end fw-bold">{{ r.qty }}</td>
        </tr>
    {% empty %}
        <tr><td colspan="4" class="text-center">No order today.</td></tr>
    {% endfor %}
    </tbody>
</table>
