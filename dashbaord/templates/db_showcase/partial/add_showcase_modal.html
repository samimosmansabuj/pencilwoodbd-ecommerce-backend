<form method="post" id="add_showcase_form" enctype="multipart/form-data" hx-ignore="true" autocomplete="off">
    <input type="hidden" name="item_id" id="showcase_item_id">

    <div class="modal fade" id="ShowcaseModal">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header border-bottom-0 bg-grd-primary py-2">
                    <h5 class="modal-title" id="showcase_modal_title">Add Item</h5>
                    <a href="javascript:;" class="primaery-menu-close" data-bs-dismiss="modal" id="close_add_showcase_modal">
                        <i class="material-icons-outlined">close</i>
                    </a>
                </div>

                <div class="modal-body">
                    <div class="card">
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Title <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="title" placeholder="e.g. Designed for Professionals" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Subtitle</label>
                                <input type="text" class="form-control" name="subtitle" placeholder="e.g. Office-ready">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Sort Order</label>
                                <input type="number" class="form-control" name="sort_order" value="0">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Media Type <span class="text-danger">*</span></label>
                                <select class="form-select" name="media_type" id="showcase_media_type" required>
                                    <option value="image">Image</option>
                                    <option value="uploaded_video">Uploaded Video</option>
                                    <option value="external_link">External Video Link (YouTube/FB/Insta/TikTok)</option>
                                    <option value="product_video">Use Existing Product Video</option>
                                </select>
                            </div>

                            <!-- IMAGE -->
                            <div class="mb-3 showcase-field" data-for="image">
                                <label class="form-label">Image</label>
                                <input type="file" class="form-control" name="image" accept="image/*">
                            </div>

                            <!-- UPLOADED VIDEO -->
                            <div class="mb-3 showcase-field" data-for="uploaded_video" style="display:none;">
                                <label class="form-label">Video File</label>
                                <input type="file" class="form-control" name="video_file" accept="video/*">
                            </div>

                            <!-- EXTERNAL LINK -->
                            <div class="mb-3 showcase-field" data-for="external_link" style="display:none;">
                                <label class="form-label">Video Link</label>
                                <input type="text" class="form-control" name="video_url" placeholder="https://youtube.com/watch?v=... or FB/Insta/TikTok link">
                            </div>

                            <!-- PRODUCT VIDEO -->
                            <div class="mb-3 showcase-field" data-for="product_video" style="display:none;">
                                <label class="form-label">Select Product Video</label>
                                <select class="form-select" name="product_video_id">
                                    <option value="">-- Select --</option>
                                    {% for pv in product_videos %}
                                    <option value="{{ pv.id }}">{{ pv.product.name }} (Video #{{ pv.id }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- POSTER (optional, for video/link types) -->
                            <div class="mb-3 showcase-field" data-for="poster" style="display:none;">
                                <label class="form-label">Poster / Thumbnail Image (optional)</label>
                                <input type="file" class="form-control" name="poster_image" accept="image/*">
                                <small class="text-muted">Shown before the video plays. If left blank on external links, the platform thumbnail may not auto-load.</small>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top-0">
                    <button type="button" class="btn btn-grd-danger" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-grd-info">Save changes</button>
                </div>
            </div>
        </div>
    </div>
</form>

<div class="modal fade" id="deleteShowcaseModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-bottom-0 py-2">
                <h5 class="modal-title">Delete Item</h5>
                <a href="javascript:;" class="primaery-menu-close" data-bs-dismiss="modal" id="close_delete_showcase_modal">
                    <i class="material-icons-outlined">close</i>
                </a>
            </div>
            <div class="modal-body delete-showcase-modal-body">Are you sure you want to delete this item?</div>
            <div class="modal-footer border-top-0">
                <button type="button" class="btn btn-grd-danger" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-grd-info" id="confirmDeleteShowcaseBtn">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function toggleShowcaseFields() {
    const type = document.getElementById("showcase_media_type").value;
    document.querySelectorAll(".showcase-field").forEach(el => {
        const target = el.dataset.for;
        if (target === type) {
            el.style.display = "block";
        } else if (target === "poster" && (type === "uploaded_video" || type === "external_link" || type === "product_video")) {
            el.style.display = "block";
        } else {
            el.style.display = "none";
        }
    });
}
document.getElementById("showcase_media_type")?.addEventListener("change", toggleShowcaseFields);

document.addEventListener("submit", async function (e) {
    if (e.target.id !== "add_showcase_form") return;
    e.preventDefault();

    const csrftoken = getCookie("csrftoken");
    if (!csrftoken) { alert("Session expired. Please refresh the page and try again."); return; }

    const form = e.target;
    const titleInput = form.querySelector("input[name='title']");
    if (!titleInput.value.trim()) { alert("Title is required"); titleInput.focus(); return; }

    try {
        const formData = new FormData(form);
        formData.set("csrfmiddlewaretoken", csrftoken);

        const response = await fetch("{% url 'showcase_list' %}", {
            method: "POST",
            body: formData,
            headers: { "X-CSRFToken": csrftoken, "X-Requested-With": "XMLHttpRequest" },
        });

        const contentType = response.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
            alert("Unexpected server response. Please refresh and try again.");
            return;
        }

        const data = await response.json();
        if (data.status) {
            document.getElementById("close_add_showcase_modal").click();
            form.reset();
            document.getElementById("showcase_item_id").value = "";
            document.getElementById("showcase_modal_title").textContent = "Add Item";
            alert(data.message);
            setTimeout(function () { window.location.reload(); }, 600);
        } else {
            alert(data.message);
        }
    } catch (error) {
        alert(error.message);
    }
});

document.addEventListener("click", async function (e) {
    const btn = e.target.closest(".edit-showcase-btn");
    if (!btn) return;

    document.getElementById("showcase_modal_title").textContent = "Update Item";
    document.getElementById("showcase_item_id").value = btn.dataset.id;

    try {
        const res = await fetch(`/site/get-showcase/${btn.dataset.id}/`);
        const data = await res.json();
        if (!data.status) { alert(data.message); return; }

        const item = data.item;
        const form = document.getElementById("add_showcase_form");
        form.querySelector("input[name='title']").value = item.title;
        form.querySelector("input[name='subtitle']").value = item.subtitle;
        form.querySelector("input[name='sort_order']").value = item.sort_order;
        form.querySelector("select[name='media_type']").value = item.media_type;
        form.querySelector("input[name='video_url']").value = item.video_url || "";
        if (item.product_video_id) {
            form.querySelector("select[name='product_video_id']").value = item.product_video_id;
        }
        toggleShowcaseFields();
    } catch (err) {
        alert(err.message);
    }
});

document.getElementById("ShowcaseModal")?.addEventListener("hidden.bs.modal", function () {
    const form = document.getElementById("add_showcase_form");
    form.reset();
    document.getElementById("showcase_item_id").value = "";
    document.getElementById("showcase_modal_title").textContent = "Add Item";
    toggleShowcaseFields();
});

let deleteShowcaseId = null;
document.addEventListener("click", function (e) {
    const btn = e.target.closest(".delete-showcase-btn");
    if (btn) {
        deleteShowcaseId = btn.dataset.id;
        document.querySelector(".delete-showcase-modal-body").textContent =
            'Are you sure you want to delete "' + btn.dataset.name + '"?';
    }
});

document.addEventListener("click", function (e) {
    if (!e.target.closest("#confirmDeleteShowcaseBtn")) return;
    if (!deleteShowcaseId) { alert("Item ID is not found"); return; }
    const csrftoken = getCookie("csrftoken");
    fetch(`/site/delete-showcase/${deleteShowcaseId}/`, {
        method: "DELETE",
        headers: { "X-CSRFToken": csrftoken, "X-Requested-With": "XMLHttpRequest" },
    })
    .then(response => response.json())
    .then(data => {
        if (data.status) {
            document.getElementById("close_delete_showcase_modal").click();
            alert(data.message);
            setTimeout(function () { window.location.reload(); }, 600);
        } else { alert(data.message); }
    })
    .catch(error => alert(error.message));
});
</script>
