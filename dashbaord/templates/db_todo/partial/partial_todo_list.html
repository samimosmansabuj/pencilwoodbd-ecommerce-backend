<div class="d-flex justify-content-between mb-3">
    <input type="search" name="search" placeholder="Search todo..." class="form-control w-25"
           hx-get="{% url 'todo_list' %}" hx-trigger="keyup changed delay:400ms" hx-target="#todo-table-wrapper">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#todoAddModal">+ Add Todo</button>
</div>
<table class="table">
    <thead><tr><th>Title</th><th>Priority</th><th>Assigned To</th><th>Due Date</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>
    {% for todo in todos %}
        <tr>
            <td>{{ todo.title }}</td>
            <td>{{ todo.get_priority_display }}</td>
            <td>{{ todo.assigned_to.get_full_name|default:"-" }}</td>
            <td>{{ todo.due_date|default:"-" }}</td>
            <td>
                <button class="btn btn-sm {% if todo.is_complete %}btn-success{% else %}btn-warning{% endif %}"
                        hx-post="{% url 'todo_toggle' todo.pk %}" hx-target="#todo-table-wrapper">
                    {% if todo.is_complete %}Complete{% else %}Pending{% endif %}
                </button>
            </td>
            <td>
                <button class="btn btn-sm btn-danger" hx-post="{% url 'todo_delete' todo.pk %}"
                        hx-target="#todo-table-wrapper" hx-confirm="Delete this todo?">Delete</button>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="6" class="text-center">No todos found.</td></tr>
    {% endfor %}
    </tbody>
</table>

<div class="modal fade" id="todoAddModal">
    <div class="modal-dialog">
        <form class="modal-content" hx-post="{% url 'todo_add' %}" hx-target="#todo-table-wrapper">
            <div class="modal-header"><h5>Add Todo</h5></div>
            <div class="modal-body">
                <input type="text" name="title" class="form-control mb-2" placeholder="Title" required>
                <textarea name="description" class="form-control mb-2" placeholder="Description"></textarea>
                <select name="priority" class="form-select mb-2">
                    {% for value, label in priority_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
                <select name="assigned_to" class="form-select mb-2">
                    <option value="">-- Assign To --</option>
                    {% for staff in staff_list %}
                    <option value="{{ staff.id }}">{{ staff.get_full_name }}</option>
                    {% endfor %}
                </select>
                <input type="date" name="due_date" class="form-control">
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
