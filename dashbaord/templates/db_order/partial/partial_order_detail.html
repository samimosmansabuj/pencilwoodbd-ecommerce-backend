<div class="main-content">
    <div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
        <div class="breadcrumb-title pe-3">Dashboard</div>
        <div class="ps-3">
            <nav>
                <ol class="breadcrumb mb-0 p-0">
                    <li class="breadcrumb-item"><a href="{% url 'dashboard' %}"><i class="bx bx-home-alt"></i></a></li>
                    <li class="breadcrumb-item">
                        <a href="{% url 'order_list' %}" hx-get="{% url 'order_list' %}" hx-target="#content-area" hx-push-url="true">Orders</a>
                    </li>
                    <li class="breadcrumb-item active">{{ order.order_id }}</li>
                </ol>
            </nav>
        </div>
    </div>

    {% if messages %}
    <div class="mb-3">
        {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    {% include "db_order/partial/order_form_body.html" %}

    <button class="btn btn-sm {% if identity_blocked %}btn-danger{% else %}btn-warning{% endif %}" data-bs-toggle="modal" data-bs-target="#trackIdentityModal">
        <i class="bi bi-shield-lock me-1"></i> {% if identity_blocked %}Blocked — View{% else %}View IP/Device{% endif %}
    </button>

    <button class="btn btn-sm btn-info" data-bs-toggle="modal" data-bs-target="#reminderAddModal">
        <i class="bi bi-alarm me-1"></i> Add Reminder
    </button>

    {% include "db_order/modal/track_identity_modal.html" %}

    <div class="modal fade" id="reminderAddModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" hx-post="{% url 'reminder_add' %}" hx-target="#content-area">
                {% csrf_token %}
                <input type="hidden" name="order_id" value="{{ order.id }}">
                <div class="modal-header"><h5 class="modal-title">Add Reminder</h5></div>
                <div class="modal-body">
                    <textarea name="note" class="form-control mb-2" placeholder="Note" required></textarea>
                    <input type="date" name="remind_date" class="form-control mb-2" required>
                    <input type="time" name="remind_time" class="form-control mb-2" required>
                    <select name="assigned_to" class="form-select">
                        <option value="">-- Assign To Staff --</option>
                        {% for staff in staff_list %}
                        <option value="{{ staff.id }}">{{ staff.get_full_name|default:staff.username }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="modal-footer"><button type="submit" class="btn btn-primary">Save Reminder</button></div>
            </form>
        </div>
    </div>
</div>
