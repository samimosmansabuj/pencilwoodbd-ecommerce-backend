{% extends 'dashboard.html' %}
{% block content %}
<div class="main-content">
    <div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
        <div class="breadcrumb-title pe-3">Dashboard</div>
        <div class="ps-3">
            <nav>
                <ol class="breadcrumb mb-0 p-0">
                    <li class="breadcrumb-item"><a href="{% url 'dashboard' %}"><i class="bx bx-home-alt"></i></a></li>
                    <li class="breadcrumb-item">
                        <a href="{% url 'order_list' %}" hx-get="{% url 'order_list' %}" hx-target="#content-area" hx-push-url="true">Orders</a>
                    </li>
                    <li class="breadcrumb-item active">{{ order.order_id }}</li>
                </ol>
            </nav>
        </div>
    </div>

    {% if messages %}
    <div class="mb-3">
        {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- {% include "db_order/partial/order_form_body.html" %} -->
    {% include "db_order/partial/order_form_body.html" %}
</div>
{% endblock %}
