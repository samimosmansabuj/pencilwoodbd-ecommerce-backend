<div class="modal fade" id="deliveryOptionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="POST" id="deliveryOptionForm" data-url="{% url 'order_delivery_option_submit' 0 %}" novalidate>
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title text-danger">Shipping Information</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <!-- Result Card Here -->
                    <div id="delivery-result">
                    </div>


                    <p class="mb-3">
                        Select a logistics partner to create parcel:
                    </p>

                    <div class="row g-3" id="logistics-option">
                    </div>

                    <div class="alert alert-danger mt-3 small">
                        Once submitted, parcel will be created in the selected logistics panel.
                    </div>

                </div>


                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-danger">
                        Submit
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function DeliveryOptionFetch() {
        const deliveryOptionBtn = document.querySelectorAll(".delivery-option-btn");
        const deliveryOptionForm = document.getElementById("deliveryOptionForm");
        const baseUrl = deliveryOptionForm.getAttribute("data-url");
        const logisticsContainer = document.getElementById("logistics-option");

        // =============================
        // AJAX FORM SUBMIT
        // =============================
        if (deliveryOptionForm.dataset.submitListenerAttached !== "true") {
            deliveryOptionForm.dataset.submitListenerAttached = "true";
            
            deliveryOptionForm.addEventListener("submit", function (e) {
                e.preventDefault();

                const selectedOption = document.querySelector('input[name="logistics_partner"]:checked');

                if (!selectedOption) {
                    alert("Please select a delivery option.");
                    return;
                }

                const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

                const submitBtn = deliveryOptionForm.querySelector("button[type='submit']");
                submitBtn.disabled = true;
                submitBtn.innerHTML = "Processing...";

                const isBulk = deliveryOptionForm.dataset.bulkMode === "true";

                // ---- BULK MODE: multiple orders -> hit order_bulk_action ----
                if (isBulk) {
                    let orderIds = [];
                    try {
                        orderIds = JSON.parse(deliveryOptionForm.dataset.bulkIds || "[]");
                    } catch (err) {
                        orderIds = [];
                    }

                    if (!orderIds.length) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = "Submit";
                        alert("No orders selected.");
                        return;
                    }

                    fetch("{% url 'order_bulk_action' %}", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": csrfToken
                        },
                        body: JSON.stringify({
                            order_ids: orderIds,
                            action: "create_parcel",
                            logistics_partner: selectedOption.value
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = "Submit";

                        if (typeof successNotificationCustom === "function" && typeof errorNotificationCustom === "function") {
                            if (data.success) {
                                successNotificationCustom(data.message);
                            } else {
                                errorNotificationCustom(data.message || "Something went wrong.");
                            }
                        } else {
                            alert(data.message || "Done.");
                        }

                        deliveryOptionForm.dataset.bulkMode = "false";
                        deliveryOptionForm.dataset.bulkIds = "";

                        const modalEl = document.getElementById('deliveryOptionModal');
                        const modalInstance = bootstrap.Modal.getOrCreateInstance(modalEl);
                        modalInstance.hide();

                        if (window.htmx) {
                            htmx.ajax('GET', window.location.href, { target: '#content-area', swap: 'innerHTML' });
                        }
                    })
                    .catch(error => {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = "Submit";
                        alert("Server error occurred.");
                        console.error(error);
                    });

                    return;
                }

                // ---- SINGLE ORDER MODE: existing behavior unchanged ----
                const formAction = deliveryOptionForm.action;

                fetch(formAction, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken
                    },
                    body: JSON.stringify({
                        logistics_partner: selectedOption.value
                    })
                })
                .then(response => response.json())
                .then(data => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "Submit";
                    if (data.success) {
                        // Clear No Shipment Card When Shipment Created Successfully
                        const noShipmentCard = document.getElementById("no-shipment-card");
                        if (noShipmentCard) noShipmentCard.remove();

                        const resultContainer = document.getElementById("delivery-result");
                        const order_shipped_data = window.createShippingCard(data.message, data.data, (document.getElementById('deliveryOptionModal').dataset.currentOrderId || ''));
                        resultContainer.insertAdjacentHTML("beforeend", order_shipped_data);

                        // Optional: disable logistics selection after success
                        document.querySelectorAll('input[name="logistics_partner"]').forEach(el => {
                            el.disabled = true;
                        });
                        // submitBtn.style.display = "none";
                    } else {
                        alert(data.message || "Something went wrong.");
                    }
                })
                .catch(error => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "Submit";
                    alert("Server error occurred.", error);
                });
            });
        }

        // TODO: Tracking Number Copy Function
        window.copyToClipboard = function(button, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = button.innerHTML;
                button.innerHTML = '<i class="lni lni-checkmark text-success"></i>';
                button.classList.add("border-success");
                setTimeout(() => {
                    button.innerHTML = originalHTML;
                    button.classList.remove("border-success");
                }, 1500);
            }).catch(err => {
                console.error("Copy failed:", err);
            });
        };

    };


    document.addEventListener("DOMContentLoaded", DeliveryOptionFetch);
    document.addEventListener("htmx:afterSwap", function (e) {
        if (e.target.id === "content-area" || e.target.closest("#content-area")) {
            DeliveryOptionFetch();
        }
    });
</script>
