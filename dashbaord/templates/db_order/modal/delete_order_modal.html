<div class="modal fade" id="deleteOrderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="POST" id="deleteOrderForm" data-url="{% url 'order_delete' 0 %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title text-danger">Delete Order</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p class="mb-0">
                        Are you sure you want to delete this order?  
                        <br>
                        <strong class="text-danger">This action cannot be undone.</strong>
                    </p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-danger">
                        Yes, Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Event delegation: works for rows added later by filters / HTMX swaps,
    // and is safe even if this partial is injected more than once.
    (function () {
        if (window.__deleteOrderBound) return;
        window.__deleteOrderBound = true;
        document.addEventListener("click", function (e) {
            const btn = e.target.closest(".delete-order-btn");
            if (!btn) return;
            const form = document.getElementById("deleteOrderForm");
            if (!form) return;
            const baseUrl = form.getAttribute("data-url");
            form.action = baseUrl.replace(/\/0\/?$/, "/" + btn.getAttribute("data-id") + "/");
        });
    })();
</script>
