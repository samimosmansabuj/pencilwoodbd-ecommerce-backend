<div class="modal fade" id="deleteOrderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="POST" id="deleteOrderForm" data-url="{% url 'order_delete' 0 %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title text-danger">Delete Order</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p class="mb-0">
                        Are you sure you want to delete this order?  
                        <br>
                        <strong class="text-danger">This action cannot be undone.</strong>
                    </p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-danger">
                        Yes, Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const deleteButtons = document.querySelectorAll(".delete-order-btn");
        const deleteForm = document.getElementById("deleteOrderForm");
        const baseUrl = deleteForm.getAttribute("data-url");

        deleteButtons.forEach(btn => {
            btn.addEventListener("click", function () {
                const orderId = this.getAttribute("data-id");
                deleteForm.action = baseUrl.replace("0", orderId);
            });
        });
    });
</script>
