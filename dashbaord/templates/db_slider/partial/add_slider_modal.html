<form method="post" id="add_slider_form" enctype="multipart/form-data" hx-ignore="true" autocomplete="off">
    <input type="hidden" name="slider_id" id="slider_id">

    <div class="modal fade" id="SliderModal">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header border-bottom-0 bg-grd-primary py-2">
                    <h5 class="modal-title" id="slider_modal_title">Add Slider</h5>
                    <a href="javascript:;" class="primaery-menu-close" data-bs-dismiss="modal" id="close_add_slider_modal">
                        <i class="material-icons-outlined">close</i>
                    </a>
                </div>

                <div class="modal-body">
                    <div class="card">
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Slider Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" placeholder="e.g. Eid Offer Banner" name="title" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Redirect URL</label>
                                <input type="text" class="form-control" placeholder="/product-list.html?category=wallet" name="url">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Button Text</label>
                                <input type="text" class="form-control" placeholder="e.g. Shop Now" name="button_name">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Slider Image <span class="text-danger">*</span></label>
                                <input type="file" class="form-control" name="image" accept="image/*" id="slider_image_input">
                                <small class="text-muted">Image will be auto-cropped to fit the hero slider size. Uploading a new image replaces the current one.</small>
                                <div class="mt-2" id="slider_current_image_wrap" style="display:none;">
                                    <img id="slider_current_image" src="" style="height:80px; border-radius:6px;">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top-0">
                    <button type="button" class="btn btn-grd-danger" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-grd-info">Save changes</button>
                </div>
            </div>
        </div>
    </div>
</form>

<!-- Delete Slider Modal -->
<div class="modal fade" id="deleteSliderModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-bottom-0 py-2">
                <h5 class="modal-title">Delete Slider</h5>
                <a href="javascript:;" class="primaery-menu-close" data-bs-dismiss="modal" id="close_delete_slider_modal">
                    <i class="material-icons-outlined">close</i>
                </a>
            </div>
            <div class="modal-body delete-slider-modal-body">Are you sure you want to delete this slider?</div>
            <div class="modal-footer border-top-0">
                <button type="button" class="btn btn-grd-danger" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-grd-info" id="confirmDeleteSliderBtn">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("submit", async function (e) {
    if (e.target.id !== "add_slider_form") return;
    e.preventDefault();

    const csrftoken = getCookie("csrftoken");
    if (!csrftoken) {
        alert("Session expired. Please refresh the page and try again.");
        return;
    }

    const form = e.target;
    const titleInput = form.querySelector("input[name='title']");
    if (!titleInput.value.trim()) {
        alert("Slider name is required");
        titleInput.focus();
        return;
    }

    const sliderId = document.getElementById("slider_id").value;
    const imageInput = document.getElementById("slider_image_input");
    if (!sliderId && !imageInput.files.length) {
        alert("Slider image is required");
        return;
    }

    try {
        const formData = new FormData(form);
        formData.set("csrfmiddlewaretoken", csrftoken);

        const response = await fetch("{% url 'slider_list' %}", {
            method: "POST",
            body: formData,
            headers: { "X-CSRFToken": csrftoken, "X-Requested-With": "XMLHttpRequest" },
        });

        const contentType = response.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
            alert("Unexpected server response. Please refresh and try again.");
            return;
        }

        const data = await response.json();

        if (data.status) {
            document.getElementById("close_add_slider_modal").click();
            form.reset();
            document.getElementById("slider_id").value = "";
            document.getElementById("slider_modal_title").textContent = "Add Slider";
            alert(data.message);
            setTimeout(function () { window.location.reload(); }, 600);
        } else {
            alert(data.message);
        }
    } catch (error) {
        alert(error.message);
    }
});

document.addEventListener("click", function (e) {
    const btn = e.target.closest(".edit-slider-btn");
    if (btn) {
        document.getElementById("slider_modal_title").textContent = "Update Slider";
        document.getElementById("slider_id").value = btn.dataset.id;

        const form = document.getElementById("add_slider_form");
        form.querySelector("input[name='title']").value = btn.dataset.title;
        form.querySelector("input[name='url']").value = btn.dataset.url;
        form.querySelector("input[name='button_name']").value = btn.dataset.buttonName;

        const imgWrap = document.getElementById("slider_current_image_wrap");
        const imgEl = document.getElementById("slider_current_image");
        if (btn.dataset.image) {
            imgEl.src = btn.dataset.image;
            imgWrap.style.display = "block";
        } else {
            imgWrap.style.display = "none";
        }
    }
});

document.getElementById("SliderModal")?.addEventListener("hidden.bs.modal", function () {
    const form = document.getElementById("add_slider_form");
    form.reset();
    document.getElementById("slider_id").value = "";
    document.getElementById("slider_modal_title").textContent = "Add Slider";
    document.getElementById("slider_current_image_wrap").style.display = "none";
});

let deleteSliderId = null;
document.addEventListener("click", function (e) {
    const btn = e.target.closest(".delete-slider-btn");
    if (btn) {
        deleteSliderId = btn.dataset.id;
        document.querySelector(".delete-slider-modal-body").textContent =
            'Are you sure you want to delete the slider "' + btn.dataset.name + '"?';
    }
});

document.addEventListener("click", function (e) {
    if (!e.target.closest("#confirmDeleteSliderBtn")) return;
    if (!deleteSliderId) {
        alert("Slider ID is not found");
        return;
    }
    const csrftoken = getCookie("csrftoken");
    fetch(`/delete-slider/${deleteSliderId}/`, {
        method: "DELETE",
        headers: { "X-CSRFToken": csrftoken, "X-Requested-With": "XMLHttpRequest" },
    })
    .then(response => response.json())
    .then(data => {
        if (data.status) {
            document.getElementById("close_delete_slider_modal").click();
            alert(data.message);
            setTimeout(function () { window.location.reload(); }, 600);
        } else {
            alert(data.message);
        }
    })
    .catch(error => alert(error.message));
});
</script>
