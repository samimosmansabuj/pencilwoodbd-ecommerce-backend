{% comment %} Campaign form look: same style family as db_offers/partial/offer_style.html (numbered cards, chips, option cards). Prefix: cpx-. {% endcomment %}
{# RULE: no muted/dim text anywhere. Secondary info = smaller size, italic or an icon, never a faded or grey colour. #}
<style>
  .cpx { --g: #34d399; --gt: rgba(52,211,153,.16); --gb: rgba(52,211,153,.6); --panel: rgba(255,255,255,.045); --panel2: rgba(255,255,255,.09);
         --line: var(--bs-border-color, rgba(255,255,255,.2)); --warn: #fbbf24; --bad: #f87171; width: 100%; max-width: none; min-width: 0; flex: 1 1 auto; }
  /* helper line under a field: smaller + icon, normal readable colour */
  .cpx-help { color: inherit; font-size: .85rem; line-height: 1.45; margin-top: 4px; }
  .cpx-help i { margin-right: 4px; }
  .cpx-intro { font-size: .95rem; line-height: 1.5; padding-left: 10px; border-left: 3px solid var(--g); }
  .cpx-card .card-body { padding: 18px; }
  .cpx-h { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; margin-bottom: 14px; }
  .cpx-h .num { background: var(--g); color: #062b1c; width: 28px; height: 28px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  .cpx-group { font-weight: 700; font-size: .9rem; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .cpx-group:first-of-type { margin-top: 0; }
  .cpx .form-control, .cpx .form-select { min-height: 44px; }
  .cpx .form-control-sm, .cpx .form-select-sm { min-height: 40px; }
  .cpx .form-label { font-weight: 600; }
  .cpx .btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .cpx .btn-sm { min-height: 40px; }
  .cpx-err { color: var(--bad); font-size: .9rem; font-weight: 600; margin-top: 4px; white-space: pre-line; }
  .cpx-err:empty { display: none; }
  .cpx .is-invalid { border-color: var(--bad); }
  .cpx-preview img { max-width: 100%; max-height: 120px; border-radius: 8px; margin-top: 8px; border: 1px solid var(--line); }
  .cpx-preview label { font-size: .85rem; display: block; margin-top: 4px; }
  .cpx-badge { display: inline-block; background: #dc2626; color: #fff; border-radius: 6px; padding: 2px 8px; font-weight: 700; font-size: .8rem; }
  /* chips: "off" = same readable colour, struck through, with a small "off" word (no dimming) */
  .cpx-chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: .8rem; margin: 2px 4px 2px 0; background: var(--panel2); }
  .cpx-chip.gift { border-color: #60a5fa; } .cpx-chip.offer { border-color: #a78bfa; }
  .cpx-chip.off { text-decoration: line-through; border-style: dashed; }
  .cpx-chip .tag { display: inline-block; margin-left: 6px; font-size: .7rem; font-weight: 700; text-decoration: none; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
  /* option cards (delivery choice) */
  .cpx-opt { display: flex; gap: 10px; align-items: flex-start; height: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; background: var(--panel); margin: 0; }
  .cpx-opt:hover { background: var(--panel2); }
  .cpx-opt.on { border-color: var(--gb); background: var(--gt); }
  .cpx-opt .form-check-input { margin-top: 3px; flex: none; width: 1.25em; height: 1.25em; }
  .cpx-opt b { display: block; }
  .cpx-opt span.d { display: block; font-size: .85rem; line-height: 1.4; }
  /* extra-settings card (collapsed by default) */
  .cpx-extra-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .cpx-summary { font-weight: 600; font-size: .9rem; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--panel2); display: block; width: 100%; }
  .cpx-setting { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .cpx-setting:last-child { border-bottom: 0; }
  .cpx-setting .form-check { min-height: 32px; }
  .cpx-setting .form-check-label { font-weight: 600; }
  .cpx-setting .form-check-input { width: 2.4em; height: 1.3em; }
  /* review card */
  .cpx-review dl { display: grid; grid-template-columns: 160px 1fr; gap: 8px 14px; margin: 0; }
  .cpx-review dt { font-weight: 700; }
  .cpx-review dd { margin: 0; }
  .cpx-rwarn { border: 1px solid var(--warn); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .cpx-rwarn ul { margin: 6px 0 0; padding-left: 20px; }
  .cpx-rok { border: 1px solid var(--g); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  /* product picker */
  .cpx-searchbox { position: relative; }
  .cpx-searchbox .bi-search { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; }
  .cpx-searchbox input { padding-left: 42px; min-height: 52px; font-size: 1.05rem; }
  .cpx-results { position: absolute; z-index: 30; left: 0; right: 0; max-height: 380px; overflow: auto; background: var(--bs-body-bg, #1e1f24); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35); margin-top: 4px; }
  .cpx-result { display: flex; gap: 10px; align-items: center; padding: 10px; min-height: 56px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .cpx-result:hover { background: var(--panel2); }
  .cpx-result img, .cpx-pimg { width: 48px; height: 48px; flex: none; object-fit: cover; border-radius: 8px; background: var(--panel2); }
  .cpx-bulk { border: 1px dashed var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .cpx-count { font-weight: 700; }
  /* product rows: one compact row per product on wide screens, two short rows below 1300px */
  #cpxProducts { display: flex; flex-direction: column; gap: 8px; }
  .cpx-prow { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 10px 12px; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 8px 14px; min-width: 0; transition: border-color .15s; }
  .cpx-prow:hover { border-color: var(--gb); }
  .cpx-prow-head { display: contents; }
  .cpx-prow .cpx-pimg { grid-column: 1; grid-row: 1; width: 48px; height: 48px; border-radius: 8px; }
  .cpx-prow-head .grow { grid-column: 2; grid-row: 1; min-width: 0; }
  .cpx-prow-head .name { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  .cpx-prow .cpx-tools { grid-column: 3; grid-row: 1; flex-wrap: nowrap; }
  .cpx-prow .cpx-tools .btn { min-height: 34px; padding: 0 10px; }
  .cpx-main { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; align-items: end; }
  .cpx-main label, .cpx-more label { font-size: .82rem; font-weight: 600; margin-bottom: 2px; display: block; }
  .cpx-prow [data-live] { grid-column: 1 / -1; grid-row: 3; margin: 0 !important; min-width: 0; }
  .cpx-prow [data-live] .fst-italic { display: none; }
  .cpx-prow .cpx-variants, .cpx-prow .cpx-more { grid-column: 1 / -1; margin: 0 !important; }
  .cpx-prow .cpx-result-box { margin: 0; padding: 6px 10px; min-height: 0; border-width: 1px; border-radius: 10px; }
  @media (min-width: 1300px) {
    .cpx-prow { grid-template-columns: 48px minmax(150px, 1fr) minmax(300px, 1.5fr) minmax(250px, 1.3fr) auto; }
    .cpx-main { grid-column: 3; grid-row: 1; }
    .cpx-prow [data-live] { grid-column: 4; grid-row: 1; }
    .cpx-prow .cpx-tools { grid-column: 5; }
  }
  .cpx-result-box { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; border: 1px solid var(--gb); background: var(--gt); }
  .cpx-price { font-size: 1.1rem; font-weight: 800; }
  .cpx-strike { text-decoration: line-through; }
  .cpx-warn { color: var(--warn); font-size: .88rem; margin-top: 6px; }
  .cpx-prow .cpx-variants { overflow-x: auto; }
  .cpx-more > summary { cursor: pointer; font-weight: 600; min-height: 40px; display: flex; align-items: center; gap: 8px; border: 1px dashed var(--line); border-radius: 10px; padding: 0 12px; list-style: none; }
  .cpx-more > summary::-webkit-details-marker { display: none; }
  .cpx-more[open] > summary { border-style: solid; border-color: var(--gb); background: var(--gt); }
  .cpx-more-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; padding-top: 12px; }
  .cpx-chip.own { border-color: var(--g); }
  .cpx-rules { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--panel); }
  .cpx-rules-title { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 10px; }
  .cpx-rules .cpx-opt { align-items: center; padding: 10px 12px; }
  .cpx-variants table { width: 100%; font-size: .9rem; }
  .cpx-variants th { font-weight: 700; padding: 4px 10px 4px 0; white-space: nowrap; }
  .cpx-variants td { padding: 4px 10px 4px 0; vertical-align: middle; }
  .cpx-drow { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
  .cpx-drow select { max-width: 240px; } .cpx-drow input { max-width: 150px; }
  .cpx-dbox { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel); }
  /* sticky save bar */
  .cpx-bar { position: sticky; bottom: 0; z-index: 20; display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap;
             padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); margin: 0; border-radius: 12px 12px 0 0; background: var(--bs-body-bg, #1e1f24);
             border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0,0,0,.3); }
  .cpx-bar .msg { margin-right: auto; font-size: .9rem; font-weight: 600; }
  .cpx-toast { position: fixed; top: 16px; right: 16px; z-index: 2000; max-width: 460px; }

  /* ---- 1024px and below: tighter cards, review list stacks ---- */
  @media (max-width: 991px) { .cpx-review dl { grid-template-columns: 130px 1fr; } .cpx-card .card-body { padding: 14px; } }
  /* ---- 768px and below: variant table becomes one card per variant; ---- */
  @media (max-width: 767px) {
    .cpx-variants table, .cpx-variants thead, .cpx-variants tbody, .cpx-variants tr, .cpx-variants td { display: block; width: 100%; }
    .cpx-variants thead { display: none; }
    .cpx-variants tr { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; background: var(--panel); }
    .cpx-variants td { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 0; }
    .cpx-variants td::before { content: attr(data-label); font-weight: 700; flex: none; }
    .cpx-variants td[data-label=""]::before, .cpx-variants td:empty { display: none; }
    .cpx-variants td .form-control, .cpx-variants td .form-select { max-width: 150px; }
    .cpx-drow select, .cpx-drow input { max-width: none; flex: 1 1 140px; }
  }
  /* ---- 575px and below (phones, 360px): everything stacks, buttons are full width ---- */
  @media (max-width: 575px) {
    .cpx-review dl { grid-template-columns: 1fr; gap: 2px; }
    .cpx-review dd { margin-bottom: 8px; }
    .cpx-bar { padding-left: 8px; padding-right: 8px; }
    .cpx-bar .msg { width: 100%; margin: 0; }
    .cpx-bar .btn { flex: 1 1 140px; padding-left: 8px; padding-right: 8px; }
    .cpx-main { grid-template-columns: 1fr 1fr; }
    .cpx-main .cpx-result-box { grid-column: 1 / -1; }
    .cpx-more-grid { grid-template-columns: 1fr; }
    .cpx-toast { left: 8px; right: 8px; max-width: none; }
    .cpx-top-actions .btn { width: 100%; }
  }
</style>
