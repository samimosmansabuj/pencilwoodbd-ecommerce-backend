<!-- Add / Edit Attribute Modal -->
<form method="post" id="add_attribute_form" hx-ignore="true" autocomplete="off">
    <input type="hidden" name="attribute_id" id="attribute_id">

    <div class="modal fade" id="AttributeModal">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header border-bottom-0 bg-grd-primary py-2">
                    <h5 class="modal-title" id="attribute_modal_title">Add Attribute</h5>
                    <a href="javascript:;" class="primaery-menu-close" data-bs-dismiss="modal"
                        id="close_add_attribute_modal">
                        <i class="material-icons-outlined">close</i>
                    </a>
                </div>

                <div class="modal-body">
                    <div class="card">
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Attribute Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" placeholder="e.g. Size, Color, Material"
                                    name="name" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Attribute Type</label>
                                <select class="form-select" name="type">
                                    {% for value, label in attribute_types %}
                                    <option value="{{ value }}">{{ label }}</option>
                                    {% endfor %}
                                </select>
                                <small class="text">Type is just a label for you — you can still add any value under any type.</small>
                            </div>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="is_variant" id="is_variant">
                                <label class="form-check-label" for="is_variant">
                                    Use this attribute for product variants
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="is_filterable" id="is_filterable">
                                <label class="form-check-label" for="is_filterable">
                                    Show this attribute as a storefront filter
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top-0">
                    <button type="button" class="btn btn-grd-danger" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-grd-info">Save changes</button>
                </div>
            </div>
        </div>
    </div>
</form>

<!-- Delete Attribute Modal -->
<div class="modal fade" id="deleteAttributeModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-bottom-0 py-2">
                <h5 class="modal-title">Delete Attribute</h5>
                <a href="javascript:;" class="primaery-menu-close" data-bs-dismiss="modal"
                    id="close_delete_attribute_modal">
                    <i class="material-icons-outlined">close</i>
                </a>
            </div>
            <div class="modal-body delete-attribute-modal-body">Are you sure you want to delete this attribute?</div>
            <div class="modal-footer border-top-0">
                <button type="button" class="btn btn-grd-danger" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-grd-info" id="confirmDeleteAttributeBtn">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    document.addEventListener("submit", async function (e) {
        if (e.target.id === "add_attribute_form") {
            e.preventDefault();

            const csrftoken = getCookie("csrftoken");
            if (!csrftoken) {
                errorNotificationCustom("Session expired. Please refresh the page and try again.");
                return;
            }

            const form = e.target;
            const nameInput = form.querySelector("input[name='name']");
            if (!nameInput.value.trim()) {
                errorNotificationCustom("Attribute name is required");
                nameInput.focus();
                return;
            }

            try {
                const formData = new FormData(form);
                formData.set("csrfmiddlewaretoken", csrftoken);

                const response = await fetch("{% url 'attribute_list' %}", {
                    method: "POST",
                    body: formData,
                    headers: {
                        "X-CSRFToken": csrftoken,
                        "X-Requested-With": "XMLHttpRequest",
                    },
                });

                if (!response.ok && response.status !== 400 && response.status !== 201) {
                    const text = await response.text();
                    console.error("Server error response:", text);
                    errorNotificationCustom("Something went wrong (status " + response.status + "). Please refresh and try again.");
                    return;
                }

                const contentType = response.headers.get("content-type") || "";
                if (!contentType.includes("application/json")) {
                    const text = await response.text();
                    console.error("Non-JSON response:", text);
                    errorNotificationCustom("Unexpected server response. Please refresh and try again.");
                    return;
                }

                const data = await response.json();

                if (data.status) {
                    document.getElementById("close_add_attribute_modal").click();
                    form.reset();
                    document.getElementById("attribute_id").value = "";
                    document.getElementById("attribute_modal_title").textContent = "Add Attribute";
                    successNotificationCustom(data.message);
                    htmx.trigger("body", "refreshAttributeList");
                    setTimeout(function () { window.location.reload(); }, 600);
                } else {
                    errorNotificationCustom(data.message);
                }

            } catch (error) {
                errorNotificationCustom(error.message);
            }
        }
    });

    document.addEventListener("click", function (e) {
        const btn = e.target.closest(".edit-attribute-btn");
        if (btn) {
            document.getElementById("attribute_modal_title").textContent = "Update Attribute";
            document.getElementById("attribute_id").value = btn.dataset.id;

            const form = document.getElementById("add_attribute_form");
            form.querySelector("input[name='name']").value = btn.dataset.name;
            form.querySelector("select[name='type']").value = btn.dataset.type;
            form.querySelector("input[name='is_variant']").checked = btn.dataset.isVariant === "true";
            form.querySelector("input[name='is_filterable']").checked = btn.dataset.isFilterable === "true";
        }
    });

    document.getElementById("AttributeModal")?.addEventListener("hidden.bs.modal", function () {
        const form = document.getElementById("add_attribute_form");
        form.reset();
        document.getElementById("attribute_id").value = "";
        document.getElementById("attribute_modal_title").textContent = "Add Attribute";
    });

    let deleteAttributeId = null;
    document.addEventListener("click", function (e) {
        const btn = e.target.closest(".delete-attribute-btn");
        if (btn) {
            deleteAttributeId = btn.dataset.id;
            document.querySelector(".delete-attribute-modal-body").textContent =
                "Are you sure you want to delete the attribute \"" + btn.dataset.name + "\"? All its values will also be deleted.";
        }
    });

    document.addEventListener("click", function (e) {
        if (e.target.closest("#confirmDeleteAttributeBtn")) {
            if (!deleteAttributeId) {
                errorNotificationCustom("Attribute ID is not found");
                return;
            }
            const csrftoken = getCookie("csrftoken");
            if (!csrftoken) {
                errorNotificationCustom("Session expired. Please refresh the page and try again.");
                return;
            }
            fetch(`/delete-attribute/${deleteAttributeId}/`, {
                method: "DELETE",
                headers: {
                    "X-CSRFToken": csrftoken,
                    "X-Requested-With": "XMLHttpRequest",
                },
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status) {
                        document.getElementById("close_delete_attribute_modal").click();
                        successNotificationCustom(data.message);
                        htmx.trigger("body", "refreshAttributeList");
                        setTimeout(function () { window.location.reload(); }, 600);
                    } else {
                        errorNotificationCustom(data.message);
                    }
                })
                .catch(error => {
                    errorNotificationCustom(error.message);
                });
        }
    });

    function successNotificationCustom(message) {
        Lobibox.notify('success', {
            title: "Success", pauseDelayOnHover: true, size: 'mini', rounded: true,
            icon: 'bi bi-check2-circle', delayIndicator: false,
            continueDelayOnInactiveTab: false, position: 'top right', msg: message
        });
    }
    function errorNotificationCustom(message) {
        Lobibox.notify('error', {
            title: "Error", pauseDelayOnHover: true, size: 'mini', rounded: true,
            icon: 'bi bi-x-circle', delayIndicator: false,
            continueDelayOnInactiveTab: false, position: 'top right', msg: message
        });
    }
</script>
