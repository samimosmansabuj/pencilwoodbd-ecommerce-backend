<div class="modal fade" id="{{ modal_id }}{{ attempt.id }}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form method="post" action="{% url 'order_attempt_status_update' attempt.pk %}" class="modal-content" style="white-space:normal;">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">Attempt #{{ attempt.id }} &mdash; Status &amp; Note</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Status</label>
          <select name="status" class="form-select mb-3">
            {% for val, label in status_choices %}<option value="{{ val }}" {% if attempt.status == val %}selected{% endif %}>{{ label }}</option>{% endfor %}
          </select>
          <label class="form-label">Note</label>
          <textarea name="note" rows="3" class="form-control">{{ attempt.note }}</textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
